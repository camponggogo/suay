[package]
name = "suay-resource-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local-only memory admission and backend supervision for SUAY"
repository = "https://github.com/camponggogo/suay"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
ctrlc = { version = "3.5", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
