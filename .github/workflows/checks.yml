name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r control/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q control compute deploy
      - run: node --check landing/main.js
      - run: node --check control/static/app.js
