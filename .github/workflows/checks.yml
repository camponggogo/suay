name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r versions/python/control/requirements.txt -r versions/python/visitor_analytics/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q versions/python deploy
      - run: node --check landing/main.js
      - run: node --check landing/anatomy.js
      - run: node --check landing/language-menu.js
      - run: node --check landing/metrics.js
      - run: node --check versions/python/control/static/app.js
      - run: python scripts/check_site.py
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: versions/rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked
