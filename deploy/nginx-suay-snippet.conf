# Public static assets only. Never proxy the organization control plane here.
location = /projects/suay {
    return 301 /projects/suay/;
}

location ^~ /projects/suay/ {
    alias /opt/suay/current/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self'; script-src 'self' 'sha256-rZv0+Cci3dg5cn3y/P+voiHaRblVcKFuR39z1MPREV8=' 'sha256-3uMgJfokoFqvEioWyGFKoaVi6Gw3LSjj5swfV/vXTZQ='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
}
