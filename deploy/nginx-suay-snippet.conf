# Public static assets only. Never proxy the organization control plane here.
location = /projects/suay {
    return 301 /projects/suay/;
}

# Independent visitor analytics. These routes do not reach the organization controller.
location = /projects/suay/admin { return 301 /projects/suay/admin/; }
location ^~ /projects/suay/admin/ {
    alias /opt/suay-visitor/current/visitor_analytics/static/;
    index index.html;
    autoindex off;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-pahvMi73H2WidVHtoQqmLdqMtnZFaM/pvuURhGvS930=' 'sha256-XuIdKwi5h/NQR3w+Q09hCmY4w74lu5901o8hntPJpGY=' 'sha256-tClwtq0k27BD3lCb13mME1jApyusuIkQlw6rMP4mgzQ=' 'sha256-p9n9gWGa86PQA6g5coAe0g4iwRsz4vLMAlYGEnBJIKk=' 'sha256-hJm52e4x2Rw6jy5EC7DLBZnlng6htW12EfjA9uSOFgA=' 'sha256-WcxjoAoR4ZIlQVnE1rbZEWn1diPlAZ8HfRgLnx3hd/w=' 'sha256-HIS0cJeBrM+qCFv2sxNud4QseO6oOLMIvsAGPQssTWg=' 'sha256-B8JAfC91CXR70du84H/HyBnliUHjQ8v9D8+oHDwh0hU=' 'sha256-pJuLwWGRhxUEWfQb/FQUu1zUjKgJRVfJyauYvW5PTM0=' 'sha256-yiHBcxO8OFMX0pVojHkiv7sILAVc98KAcUt4BYSoRLw=' 'sha256-OPugUXKTdgaT4ombgg3cb6B79YhJIGtCe3nHv9UOhWs=' 'sha256-/RwV9OUC4QdtBPbAaFKGf59hibDHGvz1PJVuDSu3DP0='; style-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
}
location ^~ /projects/suay/visitor-api/ {
    proxy_pass http://127.0.0.1:8095/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    client_max_body_size 24k;
    proxy_read_timeout 15s;
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}

location ^~ /projects/suay/ {
    alias /opt/suay/current/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self'; script-src 'self' 'sha256-pahvMi73H2WidVHtoQqmLdqMtnZFaM/pvuURhGvS930=' 'sha256-XuIdKwi5h/NQR3w+Q09hCmY4w74lu5901o8hntPJpGY=' 'sha256-tClwtq0k27BD3lCb13mME1jApyusuIkQlw6rMP4mgzQ=' 'sha256-p9n9gWGa86PQA6g5coAe0g4iwRsz4vLMAlYGEnBJIKk=' 'sha256-hJm52e4x2Rw6jy5EC7DLBZnlng6htW12EfjA9uSOFgA=' 'sha256-WcxjoAoR4ZIlQVnE1rbZEWn1diPlAZ8HfRgLnx3hd/w=' 'sha256-HIS0cJeBrM+qCFv2sxNud4QseO6oOLMIvsAGPQssTWg=' 'sha256-B8JAfC91CXR70du84H/HyBnliUHjQ8v9D8+oHDwh0hU=' 'sha256-pJuLwWGRhxUEWfQb/FQUu1zUjKgJRVfJyauYvW5PTM0=' 'sha256-yiHBcxO8OFMX0pVojHkiv7sILAVc98KAcUt4BYSoRLw=' 'sha256-OPugUXKTdgaT4ombgg3cb6B79YhJIGtCe3nHv9UOhWs=' 'sha256-/RwV9OUC4QdtBPbAaFKGf59hibDHGvz1PJVuDSu3DP0='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
}
