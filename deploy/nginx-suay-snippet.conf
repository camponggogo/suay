# Public static assets only. Never proxy the organization control plane here.
location = /projects/suay {
    return 301 /projects/suay/;
}

# Independent visitor analytics. These routes do not reach the organization controller.
location = /projects/suay/admin { return 301 /projects/suay/admin/; }
location ^~ /projects/suay/admin/ {
    alias /opt/suay-visitor/current/visitor_analytics/static/;
    index index.html;
    autoindex off;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-acYz85LvwhJwsMgsvZ/hZUvKN60ZMekZSqIxmCe+qJM=' 'sha256-3zGm+rCZh/W7z48W+Aq9HlGtGdlI+Wa0G2BUCn3gNuE=' 'sha256-hums4QVT6KzxldcYIWDXDJodva32K7G1xSI4TqfkgnA=' 'sha256-r+0O2kYy57Se44vuESoPmkxSiZnjay5lMFm8xQzROwc=' 'sha256-rp5cXz5zG2ucIOmoT0OTpa9KXFmxphQfAAr2It6mOhs=' 'sha256-A230XeuwCLkKYsmnSUumyasgOhye0f8yCaXCePUqKoc=' 'sha256-fZA/AOolFo9Co8j82AF8NIYp/YL1rzobSLfY21ol8Dw=' 'sha256-Bxk8aUX235UvChdoACug1j5RpF4dLaVJ+q59UqLVKvo=' 'sha256-uCi+qSIKLW4moM2Irn3l1kmFeptqIXBvh0iO7UPDEhM=' 'sha256-aeVm9u0NEiwVb9xfuQ9l3nzHKUZkeAMAxjg0gidNIrQ=' 'sha256-5f9u6avgafoQTEmXsWo56E48dpLY1dciXkUMPrQa1wc=' 'sha256-289mruxdH3t5hHpawgJC6DOFjQuXJWAX69KocRUFz30='; style-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
}
location ^~ /projects/suay/visitor-api/ {
    proxy_pass http://127.0.0.1:8095/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    client_max_body_size 24k;
    proxy_read_timeout 15s;
    access_log off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
}

location ^~ /projects/suay/ {
    alias /opt/suay/current/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self'; script-src 'self' 'sha256-acYz85LvwhJwsMgsvZ/hZUvKN60ZMekZSqIxmCe+qJM=' 'sha256-3zGm+rCZh/W7z48W+Aq9HlGtGdlI+Wa0G2BUCn3gNuE=' 'sha256-hums4QVT6KzxldcYIWDXDJodva32K7G1xSI4TqfkgnA=' 'sha256-r+0O2kYy57Se44vuESoPmkxSiZnjay5lMFm8xQzROwc=' 'sha256-rp5cXz5zG2ucIOmoT0OTpa9KXFmxphQfAAr2It6mOhs=' 'sha256-A230XeuwCLkKYsmnSUumyasgOhye0f8yCaXCePUqKoc=' 'sha256-fZA/AOolFo9Co8j82AF8NIYp/YL1rzobSLfY21ol8Dw=' 'sha256-Bxk8aUX235UvChdoACug1j5RpF4dLaVJ+q59UqLVKvo=' 'sha256-uCi+qSIKLW4moM2Irn3l1kmFeptqIXBvh0iO7UPDEhM=' 'sha256-aeVm9u0NEiwVb9xfuQ9l3nzHKUZkeAMAxjg0gidNIrQ=' 'sha256-5f9u6avgafoQTEmXsWo56E48dpLY1dciXkUMPrQa1wc=' 'sha256-289mruxdH3t5hHpawgJC6DOFjQuXJWAX69KocRUFz30='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
}
